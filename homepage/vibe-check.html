<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Brain Vibe Check — Brother Brooklyn</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        ahead: {
                            bg: '#FEF9F3',
                            mint: '#E6F4F1',
                            purple: '#6E44FF',
                            coral: '#FF6B6B',
                            yellow: '#FFD93D',
                            text: '#2D3142',
                        }
                    },
                }
            }
        }
    </script>
    <style>
        body { background: #FEF9F3; color: #2D3142; overflow-x: hidden; }

        .card { background: white; border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.03); border: 2px solid #F0F0F0; }
        .btn-purple { background: #6E44FF; color: white; border-radius: 24px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .btn-purple:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(110, 68, 255, 0.2); }

        .quiz-opt { background: #F8F9FA; border-radius: 24px; padding: 20px 24px; cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent; }
        .quiz-opt:hover { background: #F0F2F5; transform: translateY(-4px); }
        .quiz-opt.active { background: #E6F4F1; border-color: #6E44FF; transform: translateY(-4px); }

        .progress-container { height: 12px; background: #F0F0F0; border-radius: 99px; overflow: hidden; }
        .progress-bar { height: 100%; background: #6E44FF; transition: width 0.6s cubic-bezier(0.65, 0, 0.35, 1); border-radius: 99px; }

        @keyframes bounce-subtle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .bounce-img { animation: bounce-subtle 4s ease-in-out infinite; }

        .tag { background: #FFE8E8; color: #FF6B6B; padding: 6px 16px; border-radius: 99px; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body class="font-sans antialiased min-h-screen">

    <div class="max-w-md mx-auto px-6 py-12 min-h-screen flex flex-col items-center">
        
        <!-- Header -->
        <header class="w-full flex justify-between items-center mb-10">
            <div class="w-10 h-10 bg-ahead-purple rounded-xl flex items-center justify-center text-white font-bold text-xl">B</div>
            <div class="progress-container flex-1 mx-6">
                <div class="progress-bar" style="width: 25%"></div>
            </div>
            <button class="text-xs font-bold text-ahead-text/40 tracking-widest uppercase">Skip</button>
        </header>

        <!-- Quiz Step 1 -->
        <div id="step-1" class="step active w-full">
            <div class="flex flex-col items-center text-center">
                <div class="mb-8 relative">
                    <img src="assets/brain-character.png" class="w-48 h-48 object-contain bounce-img" alt="Playful Brain">
                    <div class="absolute -top-2 -right-2 bg-ahead-yellow w-12 h-12 rounded-full flex items-center justify-center text-2xl shadow-lg border-4 border-white">✨</div>
                </div>

                <div class="tag mb-4">Vibe Check 🧠</div>
                <h1 class="text-3xl font-extrabold mb-4 leading-tight">How does your brain feel today?</h1>
                <p class="text-ahead-text/60 text-base mb-10 font-medium leading-relaxed">Let's find your secret superpower! 🚀</p>

                <div class="space-y-4 w-full">
                    <div onclick="toggleActive(this)" class="quiz-opt flex items-center gap-4 group">
                        <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-2xl shadow-sm group-hover:bg-ahead-mint transition-colors">🔥</div>
                        <span class="font-bold text-ahead-text">Ready to conquer anything!</span>
                    </div>
                    <div onclick="toggleActive(this)" class="quiz-opt flex items-center gap-4 group">
                        <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-2xl shadow-sm group-hover:bg-ahead-mint transition-colors">😴</div>
                        <span class="font-bold text-ahead-text">A bit sleepy... need a reboot</span>
                    </div>
                    <div onclick="toggleActive(this)" class="quiz-opt flex items-center gap-4 group">
                        <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center text-2xl shadow-sm group-hover:bg-ahead-mint transition-colors">🌈</div>
                        <span class="font-bold text-ahead-text">Full of creative ideas!</span>
                    </div>
                </div>

                <button class="btn-purple w-full py-5 font-extrabold text-lg mt-10" onclick="next()">
                    Continue ➜
                </button>
            </div>
        </div>

    </div>

    <script>
        function toggleActive(el) {
            document.querySelectorAll('.quiz-opt').forEach(opt => opt.classList.remove('active'));
            el.classList.add('active');
        }

        function next() {
            alert("More playful steps coming soon! This is the 'Ahead-style' template for K-12.");
        }
    </script>
<script src="/demo-nav.js"></script>
</body>
</html>
